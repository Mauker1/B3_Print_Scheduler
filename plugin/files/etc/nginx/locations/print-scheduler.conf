    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

location = /print-scheduler/files {
    auth_request /print-scheduler-auth;
    proxy_pass http://127.0.0.1:8095/files;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

location = /print-scheduler/file {
