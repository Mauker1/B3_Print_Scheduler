# An <img> on the page, so the browser sends no header of its own. It authenticates by cookie or
# by trusted IP through the subrequest above, exactly as the page's own fetches do. A thumbnail is
# a picture of something already on the printer, and guarding it costs nothing that works today.
location = /print-scheduler/thumbnail {
    auth_request /print-scheduler-auth;
    proxy_pass http://127.0.0.1:8095/thumbnail;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # A thumbnail changes only when the file does, and the file's name is in the URL.
    add_header Cache-Control "private, max-age=300" always;
}

location = /print-scheduler/printer {
    auth_request /print-scheduler-auth;
    proxy_pass http://127.0.0.1:8095/printer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
