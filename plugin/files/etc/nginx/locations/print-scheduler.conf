# Print Scheduler: this plugin's nginx locations. Written by hand; nothing here is synthesised.
#
# The trailing slash on every proxy_pass below strips /print-scheduler/ from the request before it
# reaches the service. The service is handed /jobs, never /print-scheduler/jobs, and no header tells
# it what the browser asked for. That single character is why every URL the page emits has to be
# relative: a Location: / redirect sends the user to the printer dashboard while testing perfectly
# against the service port. There is a test asserting the page emits no absolute path of its own.

# Authentication, decided on purpose rather than by default.
#
# This plugin starts prints, so it is guarded by whatever already guards the rest of the printer's
# web interface: Moonraker's own /access/user. With force_logins off and a trusted client this is
# transparent; with force_logins on it demands the same credential Fluidd does. The thumbnail
# endpoint below is loaded by a bare <img>, which cannot set a header, so the cookie is forwarded
# too: a browser logged into Moonraker authenticates the same way for an image as for a fetch. No
# credential at all leaves all of them empty, and Moonraker falls back to trusted-IP, which is what
# makes the image work wherever the rest of the page already does.
#
# The location is named for this plugin rather than the generic /auth_check that u1-remote-screen
# uses, because two placed location files defining the same location name is an nginx config error
# and both plugins can be installed at once.
location = /print-scheduler-auth {
    internal;
    proxy_pass http://apiserver/access/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /print-scheduler { return 301 /print-scheduler/; }

# The page itself is not guarded, so an unauthenticated browser gets a page that says it is not
# authorised rather than a bare 401 with nowhere to go. The page holds no schedule data of its own;
# it fetches it from the guarded endpoints below.
location /print-scheduler/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# Unguarded on purpose: this is what you curl when something is wrong, and an endpoint that needs a
# working Moonraker to answer is useless for diagnosing a broken Moonraker. It reports the service's
# own liveness and nothing about the schedule.
location = /print-scheduler/health {
    proxy_pass http://127.0.0.1:8095/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# Everything that reads or changes the schedule, or reads the printer through us. A cached view of
# pending jobs is a wrong view of pending jobs, and a cached view of the printer is worse.
#
# These carry the authentication subrequest and the page does not, so an unauthenticated browser
# gets a page that explains itself rather than a bare 401 with nowhere to go.
location = /print-scheduler/jobs {
    auth_request /print-scheduler-auth;
    proxy_pass http://127.0.0.1:8095/jobs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

